<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>🔒 Güvenli NFC & QR Altyapısı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background-color: #09090b; color: #f4f4f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; text-align: center; }
        .sec-card { max-width: 400px; width: 100%; background: #18181b; border: 1px solid #27272a; border-radius: 24px; padding: 32px 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .icon { width: 64px; height: 64px; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px; }
        .badge { display: inline-block; background: #27272a; color: #34d399; font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px; margin-bottom: 14px; letter-spacing: 0.5px; }
        h1 { font-size: 20px; font-weight: 800; margin-bottom: 10px; color: #ffffff; }
        p { font-size: 13px; color: #a1a1aa; line-height: 1.5; margin-bottom: 20px; }
        .footer { font-size: 11px; color: #52525b; border-top: 1px solid #27272a; padding-top: 14px; }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;">
    <div class="sec-card">
        <div class="icon">🛡️</div>
        <div class="badge">256-BİT SSL & NFC KORUMALI AĞ</div>
        <h1>Yetkisiz Dizin Erişimi Engellendi</h1>
        <p>Bu sunucu kapalı devre <strong>NFC & QR Sipariş Güvenlik Protokolü</strong> ile korunmaktadır. İşletme menülerine yalnızca yetkili fiziksel NFC kartları veya QR kodları okutarak erişebilirsiniz.</p>
        <div class="footer">🔒 Dijital Güvenlik Altyapısı Aktif • E2E Encrypted</div>
    </div>
    <script>
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
        };
    </script>
</body>
</html>
</script>
</body>
</html>
