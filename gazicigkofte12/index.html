    <script>

    const DUKKAN_AYARLARI = {

    // 📋 MENÜ LİSTESİ (Opsiyon çıkmasını istediğin ürüne opsiyonTipi yazman yeterli, istemediğine null yaz)

    </script>

    <style>
        :root {
            --primary: #d32f2f;
            --primary-dark: #9a0007;
            --green: #25D366;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 110px;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 22px 16px;
            text-align: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        header h1 { font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        header p { font-size: 13px; opacity: 0.95; margin-bottom: 8px; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
        }
        .closed-banner {
            background: #ffebee;
            color: #c62828;
            border: 1.5px solid #ef9a9a;
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 14px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            display: none;
        }
        .container { max-width: 500px; margin: 0 auto; padding: 16px; }
        .category-title { font-size: 17px; font-weight: 800; margin: 16px 0 10px; color: #222; }
        .item-card {
            background: var(--card);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
        }
        .item-img {
            width: 74px;
            height: 74px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 12px;
            background: #eee;
            flex-shrink: 0;
        }
        .item-info { flex: 1; padding-right: 8px; }
        .item-title { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
        .item-desc { font-size: 12px; color: #666; margin-bottom: 6px; line-height: 1.3; }
        .item-price { font-weight: 800; color: var(--primary); font-size: 15px; }
        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(211,47,47,0.25);
        }
        .add-btn:active { transform: scale(0.94); }

        /* Alt Sepet Çubuğu */
        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: white;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            display: none;
            justify-content: center;
            z-index: 100;
        }
        .bottom-bar-inner {
            max-width: 500px; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--primary); color: white;
            padding: 14px 20px; border-radius: 16px;
            cursor: pointer; font-weight: 700;
        }

        /* Modallar (Malzeme Seçimi ve Sepet) */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            display: none; align-items: flex-end; justify-content: center;
            z-index: 200;
        }
        .modal-content {
            background: white; width: 100%; max-width: 500px;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 20px 16px; max-height: 90vh; overflow-y: auto;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #eee;
        }
        .close-btn {
            background: #f2f2f7; border: none;
            width: 32px; height: 32px; border-radius: 50%;
            font-weight: bold; cursor: pointer;
        }

        /* Opsiyon Grupları */
        .opt-group-title {
            font-size: 14px; font-weight: 800; color: #333;
            background: #f2f2f7; padding: 8px 12px; border-radius: 10px;
            margin: 12px 0 8px;
        }
        .opt-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 8px; border-bottom: 1px solid #f0f0f0;
            font-size: 14px; cursor: pointer;
        }
        .opt-row input {
            width: 19px; height: 19px; accent-color: var(--primary); margin-right: 10px;
        }
        .opt-left { display: flex; align-items: center; }
        .opt-price { font-weight: 700; color: var(--primary); font-size: 13px; }

        /* Sepet İçindeki Ürün Listesi */
        .cart-list { margin-bottom: 16px; max-height: 220px; overflow-y: auto; }
        .cart-item {
            background: #f9f9fb; border-radius: 12px; padding: 10px 12px;
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #eee;
        }
        .cart-item-details { font-size: 12px; color: #555; margin-top: 3px; line-height: 1.35; }
        .qty-controls {
            display: flex; align-items: center; gap: 6px;
            background: white; padding: 3px 6px; border-radius: 10px; border: 1px solid #ddd;
        }
        .qty-btn {
            background: none; border: none; width: 24px; height: 24px;
            font-size: 17px; font-weight: bold; color: var(--primary); cursor: pointer;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #444; }
        .form-control {
            width: 100%; padding: 11px; border: 1.5px solid #ddd;
            border-radius: 12px; font-size: 14px; user-select: text;
        }
        .iban-box {
            background: #fff8e1; border: 1.5px dashed #ffb300;
            padding: 12px; border-radius: 12px; margin-bottom: 12px; display: none;
        }
        .iban-row {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 8px 10px; border-radius: 8px;
            font-family: monospace; font-weight: 700; font-size: 13px; margin-top: 6px;
        }
        .copy-btn {
            background: var(--primary); color: white; border: none;
            padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .wp-btn {
            width: 100%; background: var(--green); color: white; border: none;
            padding: 15px; border-radius: 14px; font-size: 16px; font-weight: 800;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
        .wp-btn.disabled { background: #9e9e9e; box-shadow: none; cursor: not-allowed; }
        .primary-modal-btn {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 15px; border-radius: 14px; font-size: 16px; font-weight: 800;
            margin-top: 14px; cursor: pointer;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<header>
    <h1 id="header-title"></h1>
    <p id="header-slogan"></p>
    <div class="status-badge" id="status-badge"></div>
</header>

<div class="container">
    <div class="closed-banner" id="closed-banner"></div>
    <div id="menu-container"></div>
</div>

<!-- Alt Sepet Barı -->
<div class="bottom-bar" id="bottom-bar" onclick="openCheckout()">
    <div class="bottom-bar-inner">
        <span id="cart-count">0 Ürün</span>
        <span>Sepeti Görüntüle & Onayla ➔ <strong id="cart-total">0 TL</strong></span>
    </div>
</div>

<!-- 1. MODAL: ÜRÜN MALZEME & EKSTRA SEÇİM PENCERESİ -->
<div class="modal-overlay" id="option-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="opt-modal-title">Ürün Seçenekleri</h3>
            <button class="close-btn" onclick="closeOptionModal()">✕</button>
        </div>
        <div id="opt-modal-body"></div>
        <button class="primary-modal-btn" id="opt-add-btn" onclick="confirmOptionAdd()">
            Sepete Ekle
        </button>
    </div>
</div>

<!-- 2. MODAL: SEPET ÖZETİ VE WHATSAPP SİPARİŞ PENCERESİ -->
<div class="modal-overlay" id="checkout-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🛒 Sepetiniz & Teslimat</h3>
            <button class="close-btn" onclick="closeCheckout()">✕</button>
        </div>

        <div class="cart-list" id="cart-list-container"></div>

        <div class="form-group">
            <label>Adınız Soyadınız *</label>
            <input type="text" id="cust-name" class="form-control" maxlength="50" placeholder="Örn: Ahmet Yılmaz">
        </div>

        <div class="form-group">
            <label>Açık Adresiniz ve Tarif *</label>
            <textarea id="cust-address" class="form-control" rows="2" maxlength="200" placeholder="Mahalle, Sokak, Bina No, Daire..."></textarea>
        </div>

        <div class="form-group">
            <label>Ödeme Yöntemi</label>
            <select id="cust-payment" class="form-control" onchange="toggleIban()">
                <option value="Kapıda Nakit">💵 Kapıda Nakit</option>
                <option value="Kapıda Kredi Kartı">💳 Kapıda Kredi Kartı (POS)</option>
                <option value="IBAN / Havale">🏦 IBAN / Fast ile Ödeme</option>
            </select>
        </div>

        <div class="iban-box" id="iban-box">
            <p style="font-size:12px;"><strong>Alıcı:</strong> <span id="iban-owner"></span></p>
            <div class="iban-row">
                <span id="iban-text"></span>
                <button class="copy-btn" onclick="copyIban()" id="copy-btn">Kopyala</button>
            </div>
        </div>

        <div class="form-group">
            <label>Genel Sipariş Notu (İsteğe Bağlı)</label>
            <input type="text" id="cust-note" class="form-control" maxlength="100" placeholder="Örn: Zile basmayın, kapıda arayın">
        </div>

        <button class="wp-btn" id="wp-submit-btn" onclick="sendWhatsAppOrder()">
            📲 WhatsApp ile Siparişi Gönder
        </button>
    </div>
</div>

<script>
    Object.freeze(DUKKAN_AYARLARI);

    document.documentElement.style.setProperty('--primary', DUKKAN_AYARLARI.anaRenk);
    document.documentElement.style.setProperty('--primary-dark', DUKKAN_AYARLARI.koyuRenk);
    document.getElementById("page-title").textContent = DUKKAN_AYARLARI.dukkanAdi;
    document.getElementById("header-title").textContent = DUKKAN_AYARLARI.dukkanAdi;
    document.getElementById("header-slogan").textContent = DUKKAN_AYARLARI.slogan;
    document.getElementById("iban-owner").textContent = DUKKAN_AYARLARI.ibanAlıcı;
    document.getElementById("iban-text").textContent = DUKKAN_AYARLARI.ibanNo;

    let cart = []; // Her sepet öğesi: { uid, item, qty, secilenAcı, cikarilanlar[], ekstralar[], birimFiyat }
    let activeProduct = null;

    function sanitizeInput(str) {
        return String(str).replace(/[<>'"`;(){}]/g, "").trim();
    }

    function isShopOpen() {
        if (DUKKAN_AYARLARI.zorlaKapat) return false;
        const now = new Date();
        const cur = now.getHours() * 60 + now.getMinutes();
        const [oH, oM] = DUKKAN_AYARLARI.acilisSaati.split(":").map(Number);
        const [cH, cM] = DUKKAN_AYARLARI.kapanisSaati.split(":").map(Number);
        const openM = oH * 60 + oM;
        const closeM = cH * 60 + cM;
        return closeM < openM ? (cur >= openM || cur < closeM) : (cur >= openM && cur < closeM);
    }

    function updateShopStatusUI() {
        const acik = isShopOpen();
        const badge = document.getElementById("status-badge");
        const banner = document.getElementById("closed-banner");
        const wpBtn = document.getElementById("wp-submit-btn");

        if (acik) {
            badge.innerHTML = `🟢 Şu An Açık (${DUKKAN_AYARLARI.acilisSaati} - ${DUKKAN_AYARLARI.kapanisSaati})`;
            banner.style.display = "none";
            wpBtn.classList.remove("disabled");
            wpBtn.innerHTML = "📲 WhatsApp ile Siparişi Gönder";
        } else {
            badge.innerHTML = `🔴 Şu An Kapalı (Açılış: ${DUKKAN_AYARLARI.acilisSaati})`;
            banner.style.display = "block";
            banner.innerHTML = `⏰ İşletmemiz şu an servis dışıdır. Çalışma saatlerimiz: <strong>${DUKKAN_AYARLARI.acilisSaati} - ${DUKKAN_AYARLARI.kapanisSaati}</strong>`;
            wpBtn.classList.add("disabled");
            wpBtn.innerHTML = `🔒 Şu An Kapalıyız (${DUKKAN_AYARLARI.acilisSaati} - ${DUKKAN_AYARLARI.kapanisSaati})`;
        }
    }

    function findProductById(id) {
        for (const g of MENU_LISTESI) {
            for (const u of g.urunler) {
                if (u.id === id) return u;
            }
        }
        return null;
    }

    function renderMenu() {
        const container = document.getElementById("menu-container");
        container.innerHTML = "";
        MENU_LISTESI.forEach(grup => {
            const catTitle = document.createElement("div");
            catTitle.className = "category-title";
            catTitle.textContent = grup.kategori;
            container.appendChild(catTitle);

            grup.urunler.forEach(item => {
                const card = document.createElement("div");
                card.className = "item-card";
                card.onclick = () => handleProductClick(item.id);
                const btnText = item.opsiyonTipi ? "Seç + " : "Ekle +";
                card.innerHTML = `
                    <img src="${item.foto}" class="item-img" alt="${item.ad}" onerror="this.src='https://via.placeholder.com/150?text=Urun'">
                    <div class="item-info">
                        <div class="item-title">${item.ad}</div>
                        <div class="item-desc">${item.aciklama}</div>
                        <div class="item-price">${item.fiyat} TL</div>
                    </div>
                    <button class="add-btn">${btnText}</button>
                `;
                container.appendChild(card);
            });
        });
    }

    function handleProductClick(id) {
        const product = findProductById(id);
        if (!product) return;

        // Opsiyonu olmayan ürünse (Örn: Ayran) direkt sepete ekle
        if (!product.opsiyonTipi || !OPSIYON_SABLONLARI[product.opsiyonTipi]) {
            addToCartDirect(product);
            return;
        }

        // Opsiyonlu ürünse seçim penceresini aç
        activeProduct = product;
        const sablon = OPSIYON_SABLONLARI[product.opsiyonTipi];
        document.getElementById("opt-modal-title").textContent = product.ad;

        let html = "";

        // 1. Zorunlu Tek Seçim (Acı vb.)
        if (sablon.tekSecimler && sablon.tekSecimler.length > 0) {
            html += `<div class="opt-group-title">${sablon.tekSecimBaslik}</div>`;
            sablon.tekSecimler.forEach((sec, idx) => {
                const checked = idx === 2 ? "checked" : (idx === 0 ? "checked" : "");
                const fiyatMetin = sec.ekFiyat > 0 ? `+${sec.ekFiyat} TL` : "Ücretsiz";
                html += `
                    <label class="opt-row">
                        <div class="opt-left">
                            <input type="radio" name="opt-radio" value="${sec.ad}" data-price="${sec.ekFiyat}" ${checked} onchange="recalcOptionPrice()">
                            <span>${sec.ad}</span>
                        </div>
                        <span class="opt-price">${fiyatMetin}</span>
                    </label>
                `;
            });
        }

        // 2. Standart İç Malzemeler (İstenmeyeni Çıkar)
        if (sablon.standartMalzemeler && sablon.standartMalzemeler.length > 0) {
            html += `<div class="opt-group-title">${sablon.malzemeBaslik}</div>`;
            sablon.standartMalzemeler.forEach(malz => {
                html += `
                    <label class="opt-row">
                        <div class="opt-left">
                            <input type="checkbox" name="opt-ing" value="${malz}" checked>
                            <span>${malz}</span>
                        </div>
                        <span style="font-size:12px; color:#666;">Standart</span>
                    </label>
                `;
            });
        }

        // 3. Ekstra Ücretli Malzemeler
        if (sablon.ekstralar && sablon.ekstralar.length > 0) {
            html += `<div class="opt-group-title">${sablon.ekstraBaslik}</div>`;
            sablon.ekstralar.forEach(eks => {
                html += `
                    <label class="opt-row">
                        <div class="opt-left">
                            <input type="checkbox" name="opt-extra" value="${eks.ad}" data-price="${eks.ekFiyat}" onchange="recalcOptionPrice()">
                            <span>${eks.ad}</span>
                        </div>
                        <span class="opt-price">+${eks.ekFiyat} TL</span>
                    </label>
                `;
            });
        }

        document.getElementById("opt-modal-body").innerHTML = html;
        recalcOptionPrice();
        document.getElementById("option-modal").style.display = "flex";
    }

    function recalcOptionPrice() {
        if (!activeProduct) return;
        let total = activeProduct.fiyat;

        const selectedRadio = document.querySelector('input[name="opt-radio"]:checked');
        if (selectedRadio) total += Number(selectedRadio.dataset.price || 0);

        document.querySelectorAll('input[name="opt-extra"]:checked').forEach(el => {
            total += Number(el.dataset.price || 0);
        });

        document.getElementById("opt-add-btn").textContent = `Sepete Ekle • ${total} TL`;
    }

    function confirmOptionAdd() {
        if (!activeProduct) return;
        let birimFiyat = activeProduct.fiyat;

        const radioEl = document.querySelector('input[name="opt-radio"]:checked');
        const secilenAcı = radioEl ? radioEl.value : "";
        if (radioEl) birimFiyat += Number(radioEl.dataset.price || 0);

        // Çıkarılan malzemeleri bul (Tiki kaldırılanlar)
        const cikarilanlar = [];
        document.querySelectorAll('input[name="opt-ing"]').forEach(el => {
            if (!el.checked) cikarilanlar.push(el.value);
        });

        // Seçilen ekstraları bul
        const ekstralar = [];
        document.querySelectorAll('input[name="opt-extra"]:checked').forEach(el => {
            const p = Number(el.dataset.price || 0);
            birimFiyat += p;
            ekstralar.push(`${el.value} (+${p}TL)`);
        });

        const signature = `${activeProduct.id}|${secilenAcı}|${cikarilanlar.join(",")}|${ekstralar.join(",")}`;
        const existing = cart.find(c => c.uid === signature);
        if (existing) {
            existing.qty += 1;
        } else {
            cart.push({
                uid: signature,
                item: activeProduct,
                qty: 1,
                secilenAcı,
                cikarilanlar,
                ekstralar,
                birimFiyat
            });
        }

        closeOptionModal();
        updateBottomBar();
    }

    function addToCartDirect(product) {
        const signature = `${product.id}|||`;
        const existing = cart.find(c => c.uid === signature);
        if (existing) {
            existing.qty += 1;
        } else {
            cart.push({
                uid: signature,
                item: product,
                qty: 1,
                secilenAcı: "",
                cikarilanlar: [],
                ekstralar: [],
                birimFiyat: product.fiyat
            });
        }
        updateBottomBar();
    }

    function closeOptionModal() {
        document.getElementById("option-modal").style.display = "none";
        activeProduct = null;
    }

    function changeCartQty(index, delta) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) {
            cart.splice(index, 1);
        }
        renderCartModalList();
        updateBottomBar();
    }

    function updateBottomBar() {
        let totalItems = 0;
        let totalPrice = 0;
        cart.forEach(c => {
            totalItems += c.qty;
            totalPrice += c.qty * c.birimFiyat;
        });

        const bar = document.getElementById("bottom-bar");
        if (totalItems > 0) {
            bar.style.display = "flex";
            document.getElementById("cart-count").textContent = `${totalItems} Ürün`;
            document.getElementById("cart-total").textContent = `${totalPrice} TL`;
        } else {
            bar.style.display = "none";
            closeCheckout();
        }
    }

    function renderCartModalList() {
        const listEl = document.getElementById("cart-list-container");
        listEl.innerHTML = "";
        cart.forEach((c, idx) => {
            let det = [];
            if (c.secilenAcı) det.push(`🌶️ ${c.secilenAcı}`);
            if (c.ekstralar.length > 0) det.push(`➕ ${c.ekstralar.join(", ")}`);
            if (c.cikarilanlar.length > 0) det.push(`❌ ${c.cikarilanlar.join(" Yok, ")} Yok`);

            const div = document.createElement("div");
            div.className = "cart-item";
            div.innerHTML = `
                <div style="flex:1; padding-right:8px;">
                    <div style="font-weight:700; font-size:14px;">${c.item.ad} <span style="color:var(--primary);">(${c.birimFiyat * c.qty} TL)</span></div>
                    ${det.length > 0 ? `<div class="cart-item-details">${det.join("<br>")}</div>` : ""}
                </div>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="changeCartQty(${idx}, -1)">−</button>
                    <span style="font-weight:700; font-size:14px; min-width:16px; text-align:center;">${c.qty}</span>
                    <button class="qty-btn" onclick="changeCartQty(${idx}, 1)">+</button>
                </div>
            `;
            listEl.appendChild(div);
        });
    }

    function openCheckout() {
        updateShopStatusUI();
        renderCartModalList();
        document.getElementById("checkout-modal").style.display = "flex";
    }

    function closeCheckout() {
        document.getElementById("checkout-modal").style.display = "none";
    }

    function toggleIban() {
        const val = document.getElementById("cust-payment").value;
        document.getElementById("iban-box").style.display = val.includes("IBAN") ? "block" : "none";
    }

    function copyIban() {
        navigator.clipboard.writeText(DUKKAN_AYARLARI.ibanNo.replace(/\s+/g, ''));
        const btn = document.getElementById("copy-btn");
        btn.textContent = "Kopyalandı ✓";
        btn.style.background = "#2e7d32";
        setTimeout(() => {
            btn.textContent = "Kopyala";
            btn.style.background = DUKKAN_AYARLARI.anaRenk;
        }, 2000);
    }

    function sendWhatsAppOrder() {
        if (!isShopOpen()) {
            alert(`İşletmemiz şu an kapalıdır. Sipariş saatlerimiz: ${DUKKAN_AYARLARI.acilisSaati} - ${DUKKAN_AYARLARI.kapanisSaati}`);
            return;
        }

        const name = sanitizeInput(document.getElementById("cust-name").value);
        const address = sanitizeInput(document.getElementById("cust-address").value);
        const payment = sanitizeInput(document.getElementById("cust-payment").value);
        const note = sanitizeInput(document.getElementById("cust-note").value);

        if (!name || !address) {
            alert("Lütfen adınızı ve açık adresinizi yazın.");
            return;
        }

        let orderLines = [];
        let total = 0;

        cart.forEach(c => {
            const sub = c.qty * c.birimFiyat;
            total += sub;
            orderLines.push(`▪️ *${c.qty}x ${c.item.ad}* (${sub} TL)`);
            if (c.secilenAcı) orderLines.push(`   ↳ Tercih: ${c.secilenAcı}`);
            if (c.ekstralar.length > 0) orderLines.push(`   ↳ Ekstra: ${c.ekstralar.join(", ")}`);
            if (c.cikarilanlar.length > 0) orderLines.push(`   ↳ Çıkarılacak: *${c.cikarilanlar.join(" YOK, ")} YOK*`);
        });

        if (total < DUKKAN_AYARLARI.minSiparisTutari) {
            alert(`Minimum paket servis tutarı ${DUKKAN_AYARLARI.minSiparisTutari} TL'dir.`);
            return;
        }

        const message = [
            `🔔 *${DUKKAN_AYARLARI.dukkanAdi} - YENİ SİPARİŞ!*`,
            "",
            "*Sipariş Detayı:*",
            ...orderLines,
            "",
            `💰 *Toplam Tutar:* ${total} TL`,
            `💳 *Ödeme:* ${payment}`,
            `👤 *Müşteri:* ${name}`,
            `📍 *Adres:* ${address}`,
            note ? `📝 *Not:* ${note}` : ""
        ].filter(Boolean).join("\n");

        const cleanPhone = DUKKAN_AYARLARI.whatsappNo.replace(/\D/g, '');
        const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
        window.open(url, "_blank", "noopener,noreferrer");
    }

    document.addEventListener("keydown", function(e) {
        if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "u")) {
            e.preventDefault();
        }
    });

    updateShopStatusUI();
    renderMenu();
</script>
</body>
</html>
